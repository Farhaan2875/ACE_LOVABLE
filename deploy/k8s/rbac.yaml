# Permissions for the Ace backend when it runs INSIDE a cluster with ACE_EXECUTION_RUNNER=kubernetes.
# It may only manage the per-project preview namespaces, nothing else.
apiVersion: v1
kind: ServiceAccount
metadata: {name: ace-backend, namespace: ace}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: ace-preview-manager}
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, create, patch, delete]
  - apiGroups: [""]
    resources: [pods, services, pods/log]
    verbs: [get, list, create, patch, delete, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: ace-preview-manager}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: ace-preview-manager}
subjects: [{kind: ServiceAccount, name: ace-backend, namespace: ace}]
