spring:
  datasource:
    url: jdbc:h2:mem:ace;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
ace:
  rag:
    enabled: false
  storage:
    local-root: ./target/test-data/projects
  execution:
    auto-preview: false
    local:
      work-dir: ./target/test-data/previews
